[project]
name = "alyr-api"
version = "0.1.0"
description = "Alyr core API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "resvg-py==0.5.0",
    "fonttools>=4.55",
    "pillow>=12.3,<13",
]

[dependency-groups]
# The web server for running as a normal process. Kept out of the core dependencies
# because Cloudflare Workers cannot install it and do not need it.
server = [
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alyr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stress: repeats a race many times (ALYR_STRESS_ROUNDS, 50 by default); leave out with -m 'not stress'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.uv]
default-groups = ["dev", "server"]

[tool.ruff.lint.per-file-ignores]
# The catalogue is mostly customer-facing sentences and SQL; breaking them hurts reading.
"src/alyr/catalog.py" = ["E501"]
# Each type's words, in both languages, are kept together for the Arabic review (ALY-66).
"src/alyr/presets_catalog.py" = ["E501"]
# The features' and templates' words, in both languages, are kept together for the same review.
"src/alyr/capabilities.py" = ["E501"]
"src/alyr/shop_templates.py" = ["E501"]
# Each demo shop's words, in both languages, are kept in one table per shop (ALY-110).
"src/alyr/demo/shops/*.py" = ["E501"]
"src/alyr/demo/*.py" = ["E501"]
"tests/test_catalog_demos.py" = ["E501"]
"tests/test_catalog_concurrency.py" = ["E501"]
"tests/test_catalog_stress.py" = ["E501"]
"tests/test_catalog_scenarios_audit.py" = ["E501"]
# The email template is one HTML document; wrapping its lines would change nothing for readers.
"src/alyr/core/mail.py" = ["E501"]
