[project]
name = "alyr-api"
version = "0.1.0"
description = "Alyr core API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
]

[dependency-groups]
# The web server for running as a normal process. Kept out of the core dependencies
# because Cloudflare Workers cannot install it and do not need it.
server = [
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alyr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.uv]
default-groups = ["dev", "server"]

[tool.ruff.lint.per-file-ignores]
# The catalogue is mostly customer-facing sentences and SQL; breaking them hurts reading.
"src/alyr/catalog.py" = ["E501"]
# The email template is one HTML document; wrapping its lines would change nothing for readers.
"src/alyr/core/mail.py" = ["E501"]
