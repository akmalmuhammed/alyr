appId: app.heldat.mobile
name: Arabic selection reaches the RTL Today experience
tags:
  - smoke
  - localization
  - rtl
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    file: "../subflows/complete-worldline-intro.yaml"
- extendedWaitUntil:
    visible:
      id: "auth-welcome-screen"
    timeout: 20000
- runFlow:
    label: Normalize the persisted locale to English
    when:
      visible: "English"
    commands:
      - tapOn: "English"
- tapOn:
    text: "العربية"
    enabled: true
- assertVisible: "English"
- assertVisible: "أنشئ مساحتك الخاصة"
- assertVisible: "استكشف نموذجًا"
- tapOn:
    text: "استكشف نموذجًا"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertVisible: "اليوم"
- assertVisible: "منزل تجريبي"
- tapOn:
    id: "today-portfolio-entry"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "portfolio-screen"
    timeout: 15000
- assertVisible:
    id: "portfolio-net-position"
- assertVisible:
    id: "portfolio-net-position-visibility"
- assertVisible:
    id: "liabilities-list"
- tapOn:
    id: "liability-add"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "liability-create-screen"
    timeout: 15000
- assertVisible:
    id: "liability-name"
- assertVisible:
    id: "liability-category"
- assertVisible:
    id: "liability-amount"
- assertVisible:
    id: "liability-as-of"
