appId: com.alyr.continuity
name: Returning user reviews Today, Portfolio and Atlas
tags:
  - smoke
  - returning
  - portfolio
  - atlas
---
- runFlow:
    file: "../subflows/start-sample-workspace.yaml"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- tapOn:
    id: "today-portfolio-entry"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "portfolio-screen"
    timeout: 15000
- assertVisible:
    id: "portfolio-dashboard"
- tapOn:
    text: "Back"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "today-atlas-entry"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 80
- tapOn:
    id: "today-atlas-entry"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "atlas-screen"
    timeout: 15000
- assertVisible: "Globe"
- tapOn:
    text: "List"
    enabled: true
- assertVisible: "Every Place"
