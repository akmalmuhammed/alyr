appId: app.heldat.mobile
---
- extendedWaitUntil:
    visible:
      id: "capture-step-0"
    timeout: 20000
- tapOn:
    id: "capture-asset-name"
- inputText: "${ASSET_NAME}"
- hideKeyboard
- tapOn:
    text: "Watch"
    enabled: true
- tapOn:
    text: "Continue"
    enabled: true
- assertVisible:
    id: "capture-step-1"
- tapOn:
    text: "I don't know yet"
    enabled: true
- tapOn:
    text: "Continue"
    enabled: true
- assertVisible:
    id: "capture-step-2"
- tapOn:
    text: "Skip for now"
    enabled: true
- assertVisible:
    id: "capture-step-3"
- assertVisible: "${ASSET_NAME}"
- tapOn:
    text: "Save Passport"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "asset-passport-saved-confirmation"
    timeout: 20000
- assertVisible:
    id: "asset-passport-screen"
- assertVisible: "Passport started"
- assertVisible: "${ASSET_NAME}"
