# The public site (alyr.qa) from GitHub to the Cloudflare Worker `alyr-site`.
#
# - Every pull request gets a preview: the site is built with scripts/build-site.sh and
#   uploaded as a new *version* of `alyr-site` that takes no traffic (`wrangler versions
#   upload`). Cloudflare gives each version its own address on workers.dev, plus a fixed
#   alias per pull request (pr-<number>-alyr-site.<subdomain>.workers.dev). The address is
#   posted on the pull request.
# - Production changes only when someone runs this workflow by hand (Actions > site deploy >
#   Run workflow, from main, with the release's version). A push to main publishes nothing
#   (ALY-269). Three jobs, in order:
#     gate        release-gate.yml: the commit's ci run is green, the version is cut in
#                 CHANGELOG.md and unused;
#     production  waits on the GitHub environment `production`, which has the founder as its
#                 required reviewer, then builds, checks and publishes;
#     tag         after alyr.qa serves the commit: the commit is tagged with the version.
# - The Cloudflare token and account ID are environment secrets, not repository secrets: the
#   `production` job reads them from `production` (after the approval), previews from `preview`.
# - Every build carries its commit (out-site/version.txt and <meta name="alyr-build">), and
#   every version on Cloudflare is tagged with it.
#
# Runbook, secrets and rollback: docs/runbooks/site-deploy.md. Release procedure:
# docs/runbooks/release.md. The manual fallback stays: `pnpm site:deploy` (or `pnpm exec
# wrangler deploy`) from apps/web on the founder's laptop.

name: site deploy

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "design/**"
      - "scripts/build-site.sh"
      - "scripts/site-defer-scripts.mjs"
      - "scripts/tokens-build.mjs"
      - "scripts/site/**"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "The release, v0.x.y. Its section must be cut in CHANGELOG.md (docs/runbooks/release.md)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  preview:
    # Pull requests from forks get no secrets and never run here.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own environment, with its own (narrower) Cloudflare token and no reviewer: a preview
    # must run unattended. Delete the secrets of this environment to switch previews off; the
    # build still runs. Setup: docs/runbooks/site-deploy.md, step 1.
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: site-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Stamp the pull request's own commit, not GitHub's temporary merge commit.
      ALYR_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      ALYR_BUILD_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The Cloudflare token is NOT set here: only the two steps that talk to Cloudflare get it,
      # so the dependency install and the build of the pull request's code never see it (ALY-245).
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - name: Cloudflare credentials present?
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare secrets yet (docs/runbooks/site-deploy.md, step 1), so no preview was uploaded. The site was built."
          fi
      - name: Upload a preview version (takes no traffic)
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          short="${ALYR_BUILD_SHA:0:7}"
          # REDIRECT off: the preview address must not send visitors on to alyr.qa.
          # PREVIEW on: the Worker adds X-Robots-Tag noindex.
          pnpm exec wrangler versions upload --config wrangler.jsonc \
            --preview-alias "pr-${PR_NUMBER}" \
            --var REDIRECT:off --var PREVIEW:on \
            --tag "$short" \
            --message "Preview of PR #${PR_NUMBER}, commit ${ALYR_BUILD_SHA}"
      - name: Post the preview address on the pull request
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          entry="$(grep '"type":"version-upload"' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          version="$(echo "$entry" | jq -r '.version_id')"
          url="$(echo "$entry" | jq -r '.preview_url // empty')"
          alias="$(echo "$entry" | jq -r '.preview_alias_url // empty')"
          if [ -z "$url" ]; then
            echo "::warning::Cloudflare gave no preview address. Preview URLs are probably still off for alyr-site (docs/runbooks/site-deploy.md, step 3)."
          fi
          marker="<!-- alyr-site-preview -->"
          # The backticks are Markdown for the comment, not a command.
          # shellcheck disable=SC2016
          body="$(printf '%s\n**Site preview** for commit `%s`\n\n- This commit: %s\n- This pull request (always the latest commit): %s\n- Cloudflare version: `%s` (takes no traffic on alyr.qa)\n\nCheck `/version.txt` on the preview to see which commit it serves. Publishing to alyr.qa waits for the founder to approve it: docs/runbooks/site-deploy.md.' \
            "$marker" "${ALYR_BUILD_SHA:0:7}" "${url:-none}" "${alias:-none}" "$version")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
          echo "Preview: ${url:-none} (alias ${alias:-none})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-site-pr-${{ github.event.pull_request.number }}
          path: apps/web/out-site
          retention-days: 14

  gate:
    # Checked before the founder is asked to approve anything. Pull requests only get previews.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-gate.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      actions: read
      contents: read

  production:
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The founder is this environment's required reviewer: the job waits for his approval, and
    # only then can it read the environment's Cloudflare secrets.
    environment:
      name: production
      url: https://alyr.qa
    concurrency:
      group: site-production
      cancel-in-progress: false
    env:
      ALYR_BUILD_SHA: ${{ github.sha }}
      ALYR_BUILD_BRANCH: ${{ github.ref_name }}
      # The Cloudflare token is set on the deploy step only (ALY-245).
      # Product analytics (D-070), production only: previews are not counted.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
      # Search engines' ownership tags in <head> (D-056); empty means no tag.
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The same build and checks as the CI site job; nothing is published if one fails.
      - run: pnpm site:check
      - name: Deploy to alyr.qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set (docs/runbooks/site-deploy.md, step 1)"; exit 1; }
          pnpm exec wrangler deploy --config wrangler.jsonc \
            --tag "${ALYR_BUILD_SHA:0:7}" \
            --message "Production from ${ALYR_BUILD_BRANCH}, commit ${ALYR_BUILD_SHA}"
      - name: alyr.qa serves this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS "https://alyr.qa/version.txt?check=${attempt}" | head -n 1 || true)"
            if [ "$live" = "commit ${ALYR_BUILD_SHA}" ]; then
              echo "alyr.qa serves ${ALYR_BUILD_SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::alyr.qa answers '${live}', not commit ${ALYR_BUILD_SHA}. See docs/runbooks/site-deploy.md (Roll back)."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-site-production-${{ github.sha }}
          path: apps/web/out-site
          retention-days: 90

  tag:
    # Only a release that alyr.qa really serves is tagged. Where deploy-gcp already tagged the
    # same commit with the same version, this finds the tag and does nothing.
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the commit
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh tag "$VERSION" "$GITHUB_SHA"
