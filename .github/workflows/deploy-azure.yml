name: deploy-azure

# Builds ALYR's three images, pushes them to the Azure registry, and (when asked) deploys
# them: migrations first, then the API, worker and web app (D-036, ALY-10).
#
# Started by hand only (Actions > deploy-azure > Run workflow), from main. Signs in to
# Azure with GitHub's short-lived token (OIDC): no password or key is stored in GitHub.
# Needs the repository variables printed by `infra/azure/setup.sh github`.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (false: build and push only, for the first setup)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the registry and the API's address
        run: |
          az acr login --name "$REGISTRY"
          server="$(az acr show -n "$REGISTRY" --query loginServer -o tsv)"
          domain="$(az containerapp env show -g "$RG" -n alyr-env --query properties.defaultDomain -o tsv)"
          echo "SERVER=$server" >> "$GITHUB_ENV"
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"
          # The web app's public address, for its staff link; a custom domain if one is set.
          web_url="${{ vars.ALYR_WEB_URL }}"
          echo "WEB_URL=${web_url:-https://alyr-web.$domain}" >> "$GITHUB_ENV"

      - name: Build and push the images
        run: |
          docker build -t "$SERVER/alyr-api:$TAG" apps/api
          docker build -t "$SERVER/alyr-backup:$TAG" infra/backup
          # The web app forwards /api/* to the API's address inside Azure, over HTTPS.
          docker build -t "$SERVER/alyr-web:$TAG" \
            --build-arg ALYR_API_URL="https://alyr-api.$DOMAIN" \
            --build-arg NEXT_PUBLIC_ALYR_WORKSPACE_URL="$WEB_URL" \
            apps/web
          for image in alyr-api alyr-backup alyr-web; do docker push "$SERVER/$image:$TAG"; done
          echo "Pushed images tagged $TAG"

      - name: Migrate, then roll out
        if: inputs.deploy
        run: |
          az containerapp job update -g "$RG" -n alyr-migrate --image "$SERVER/alyr-api:$TAG" --output none
          run="$(az containerapp job start -g "$RG" -n alyr-migrate --query name -o tsv)"
          for _ in $(seq 1 60); do
            status="$(az containerapp job execution show -g "$RG" -n alyr-migrate --job-execution-name "$run" --query properties.status -o tsv)"
            echo "migrations: $status"
            [ "$status" = "Succeeded" ] && break
            if [ "$status" = "Failed" ] || [ "$status" = "Stopped" ]; then echo "Migrations failed; nothing was rolled out." >&2; exit 1; fi
            sleep 10
          done
          [ "$status" = "Succeeded" ] || { echo "Migrations did not finish in 10 minutes." >&2; exit 1; }
          az containerapp update -g "$RG" -n alyr-api --image "$SERVER/alyr-api:$TAG" --output none
          az containerapp update -g "$RG" -n alyr-worker --image "$SERVER/alyr-api:$TAG" --output none
          az containerapp update -g "$RG" -n alyr-web --image "$SERVER/alyr-web:$TAG" --output none
          if az containerapp job show -g "$RG" -n alyr-backup --output none 2>/dev/null; then
            az containerapp job update -g "$RG" -n alyr-backup --image "$SERVER/alyr-backup:$TAG" --output none
          fi

      - name: Check it is healthy
        if: inputs.deploy
        run: |
          for _ in $(seq 1 30); do curl -fs "https://alyr-api.$DOMAIN/health/ready" && break; sleep 10; done
          curl -fs "https://alyr-api.$DOMAIN/health/ready"
          for _ in $(seq 1 18); do curl -fs "https://alyr-api.$DOMAIN/health/worker" && break; sleep 10; done
          curl -fs "https://alyr-api.$DOMAIN/health/worker"
          curl -fs -o /dev/null "https://alyr-web.$DOMAIN/login"
          echo "Deployed $TAG"
