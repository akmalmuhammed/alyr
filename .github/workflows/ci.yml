name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the code and nothing else unless they say so (ALY-114).
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyr
          POSTGRES_PASSWORD: alyr_local
          POSTGRES_DB: alyr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALYR_ENV: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked: fail if uv.lock does not match pyproject.toml, so CI tests what we ship.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      # Known vulnerabilities in Python dependencies.
      - run: uvx pip-audit --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Colours and fonts come from design/tokens.json only; the generated files are current.
      - run: node ../../scripts/design-check.mjs
      # Known vulnerabilities in what the site and workspace ship.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      # The customer pages' small pure helpers and the QR codes, read back with a decoder.
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  # The public site as it is published: the real scripts/build-site.sh (not only `next
  # build`), then the checks that need no database: EN/AR copy parity, banned words and
  # prices with the offer off, and internal links (scripts/site/check.mjs).
  site:
    runs-on: ubuntu-latest
    env:
      # Stamp the pull request's own commit, not GitHub's temporary merge commit.
      ALYR_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ALYR_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-site
          path: apps/web/out-site
          retention-days: 14
