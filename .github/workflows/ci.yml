name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the code and nothing else unless they say so (ALY-114).
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyr
          POSTGRES_PASSWORD: alyr_local
          POSTGRES_DB: alyr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALYR_ENV: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked: fail if uv.lock does not match pyproject.toml, so CI tests what we ship.
      - run: uv sync --locked
      - run: uv run ruff check .
      # The API image as Cloudflare runs it (D-052): build apps/api/Dockerfile, migrate the
      # database above, start the entrypoint (API + job runner) and ask /health. Fails if the
      # image cannot start with production settings, which pytest alone would not notice.
      - run: docker build -t alyr-api .
      - name: Start the image
        run: |
          docker run --rm --network host alyr-api python -m alyr.migrate
          docker run -d --name api --network host \
            -e ALYR_ENV=production -e ALYR_JOBS_INLINE=false \
            -e ALYR_LINK_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
            -e PORT=8080 alyr-api
      - name: Image answers /health and runs the job runner
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 2
          done
          docker exec api sh -c "grep -qa 'alyr[.]worker' /proc/[0-9]*/cmdline"
          # The API docs are off in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = "404"
          docker rm -f api
      - run: uv run pytest
      # Known vulnerabilities in Python dependencies.
      - run: uvx pip-audit --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Colours and fonts come from design/tokens.json only; the generated files are current.
      - run: node ../../scripts/design-check.mjs
      # Known vulnerabilities in what the site and workspace ship.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      # The customer pages' small pure helpers and the QR codes, read back with a decoder.
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # The client portal as Cloudflare runs it (OpenNext), so a change that builds with
      # `next build` but not for Workers is caught here (D-052).
      - run: pnpm portal:build

  # The Cloudflare Worker that fronts the API container (infra/cloudflare/api).
  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/cloudflare/api/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/cloudflare/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck

  # The public site as it is published: the real scripts/build-site.sh (not only `next
  # build`), then the checks that need no database: EN/AR copy parity, banned words and
  # prices with the offer off, and internal links (scripts/site/check.mjs).
  site:
    runs-on: ubuntu-latest
    env:
      # Stamp the pull request's own commit, not GitHub's temporary merge commit.
      ALYR_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ALYR_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-site
          path: apps/web/out-site
          retention-days: 14
