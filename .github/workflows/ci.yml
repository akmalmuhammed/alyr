name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs read the code and nothing else unless they say so (ALY-114).
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The API's checks, in three parts so that the run is as long as the slowest part and not the
  # sum: the tests in slices (`api-shard`), everything else that is not a test (`api-image`), and
  # `api`, which passes only when both did and the slices together ran every test exactly once.
  # `api` keeps its name on purpose: it is the required check in branch protection
  # (docs/runbooks/release.md), and the release gate reads the conclusion of the whole run.

  # The test suite, cut into slices of whole test files by weight (tests/conftest.py,
  # "Sharding"). Each slice runs on its own runner with its own PostgreSQL, so the suite's one
  # `alyr_test` database is never shared. To add a slice, add its number to the list.
  api-shard:
    name: api-shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyr
          # No password: the database lives for this job only, on the runner (the `coverage`
          # and `e2e` workflows do the same). The settings the tests connect with are unchanged.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: alyr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALYR_ENV: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked: fail if uv.lock does not match pyproject.toml, so CI tests what we ship.
      - run: uv sync --locked
      - name: Tests, one slice of the suite
        run: |
          mkdir -p shard-out
          uv run pytest \
            --shard="${{ matrix.shard }}/${{ strategy.job-total }}" \
            --shard-report="shard-out/shard-${{ matrix.shard }}.json" \
            --junitxml="shard-out/junit-${{ matrix.shard }}.xml"
      # What each slice ran, and how long each file took (to rebalance: scripts/ci/shards.py).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-shard-${{ matrix.shard }}
          path: apps/api/shard-out
          retention-days: 7

  # Everything about the API that is not a test: lint, the image built, started with production
  # settings and asked for /health, and the audit of the locked dependencies. Once, not per slice.
  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyr
          POSTGRES_PASSWORD: alyr_local
          POSTGRES_DB: alyr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALYR_ENV: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked: fail if uv.lock does not match pyproject.toml, so CI tests what we ship.
      - run: uv sync --locked
      - run: uv run ruff check .
      # The API image with no argument (API + job runner, as D-052 runs it): build
      # apps/api/Dockerfile, migrate the database above, start it and ask /health. Fails if the
      # image cannot start with production settings, which pytest alone would not notice.
      # A throwaway container has no R2, so only here may photos stay on its own disk.
      - run: docker build -t alyr-api .
      - name: Start the image
        run: |
          docker run --rm --network host alyr-api python -m alyr.migrate
          docker run -d --name api --network host \
            -e ALYR_ENV=production -e ALYR_JOBS_INLINE=false \
            -e ALYR_LINK_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
            -e ALYR_MEDIA_ALLOW_LOCAL=true \
            -e PORT=8080 alyr-api
      - name: Image answers /health and runs the job runner
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 2
          done
          docker exec api sh -c "grep -qa 'alyr[.]worker' /proc/[0-9]*/cmdline"
          # The API docs are off in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = "404"
          docker rm -f api
      # Known vulnerabilities in the locked Python dependencies. `uvx pip-audit` alone would
      # audit pip-audit's own environment, not ours (ALY-243), so the lock file is exported
      # and audited by name.
      - run: |
          uv export --frozen --no-emit-project --no-hashes > /tmp/locked.txt
          uvx pip-audit -r /tmp/locked.txt --no-deps --disable-pip --progress-spinner off

  # The one check that stands for the API. Passes only when every slice and the image job passed
  # AND the slices between them ran every test of the suite exactly once (a slice that was
  # skipped, cancelled, lost or left tests out cannot read as green). `if: always()` so that a
  # failed slice makes this job red rather than skipped.
  api:
    needs: [api-shard, api-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: The slices and the image job passed
        env:
          SHARDS: ${{ needs.api-shard.result }}
          IMAGE: ${{ needs.api-image.result }}
        run: |
          echo "api-shard: $SHARDS; api-image: $IMAGE"
          if [ "$SHARDS" != success ] || [ "$IMAGE" != success ]; then
            echo "::error::A part of the API checks did not pass (api-shard: $SHARDS, api-image: $IMAGE)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: api-shard-*
          merge-multiple: true
          path: shard-out
      - name: The slices ran the whole suite, once
        run: python3 scripts/ci/shards.py check shard-out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Colours and fonts come from design/tokens.json only; the generated files are current.
      - run: node ../../scripts/design-check.mjs
      # The product UI ratchet: off-scale sizes, radii and gaps, the one button system, banned
      # words; counts in design/ui-ratchet.json only go down (no browser needed).
      - run: node ../../scripts/ui-check.mjs
      # Known vulnerabilities in what the site and workspace ship.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      # The customer pages' small pure helpers and the QR codes, read back with a decoder.
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # The client portal as Cloudflare runs it (OpenNext), so a change that builds with
      # `next build` but not for Workers is caught here (D-052).
      - run: pnpm portal:build

  # The Cloudflare Worker that fronts the API container (infra/cloudflare/api).
  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/cloudflare/api/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/cloudflare/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck

  # The public site as it is published: the real scripts/build-site.sh (not only `next
  # build`), then the checks that need no database: EN/AR copy parity, banned words and
  # prices with the offer off, and internal links (scripts/site/check.mjs).
  site:
    runs-on: ubuntu-latest
    env:
      # Stamp the pull request's own commit, not GitHub's temporary merge commit.
      ALYR_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ALYR_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-site
          path: apps/web/out-site
          retention-days: 14
      # The same build and checks with the "Try it free" button switched on (ALY-211, site.ts
      # `TRY_FREE_LIVE`): the first run proves that off the site carries no trace of it, this one
      # that the button, its address and "Book a check-up" beside it are right on every page, so
      # the switch cannot rot before the founder uses it. Not uploaded: it is not what is published.
      - name: site:check with the Try it free button on
        run: pnpm site:check
        env:
          NEXT_PUBLIC_ALYR_TRY_FREE: "on"
