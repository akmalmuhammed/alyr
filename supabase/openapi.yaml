        acknowledgeIrreversibleDeletion:
          type: boolean
          const: true
    AccountDeletionReceipt:
      type: object
      additionalProperties: false
      required:
        - accountId
        - deletedHouseholdIds
        - departedHouseholdIds
        - deletedAt
      properties:
        accountId:
          type: string
          format: uuid
        deletedHouseholdIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        departedHouseholdIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        deletedAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [errorVersion, code, message, retryable]
      properties:
        errorVersion:
          type: integer
          const: 1
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        retryable:
          type: boolean
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [errorVersion, code, message, retryable]
          properties:
            errorVersion:
              type: integer
              const: 1
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
            retryable:
              type: boolean
    StorageCapacityErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [errorVersion, code, message, retryable]
          properties:
            errorVersion:
              type: integer
              const: 1
            code:
              type: string
              const: QUOTA_EXCEEDED
            message:
              type: string
              description: >
                Provider-neutral user action. Database sentinels, configured
                limits, usage totals, and storage-provider details are omitted.
            retryable:
              type: boolean
              const: false
    ApiErrorCode:
      type: string
      description: >
        QUOTA_EXCEEDED is action-required, including household or Heldat
        storage saturation, and must always carry retryable=false.
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - CONFLICT_REQUIRES_REVIEW
        - IDEMPOTENCY_CONFLICT
        - INVALID_COMMAND
        - INVALID_CURSOR
        - INVALID_FILE
        - NOT_FOUND
        - OFFLINE
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - SESSION_EXPIRED
        - STORAGE_UNAVAILABLE
        - UNSUPPORTED_CONTRACT_VERSION
        - VALIDATION_FAILED
