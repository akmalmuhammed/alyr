openapi: 3.1.0
info:
  title: Heldat Pilot API
  version: 0.1.0
  description: >
    Provider-neutral authenticated API for the focused Heldat household,
    asset, evidence, and offline-sync pilot.
servers:
  - url: https://{project}.supabase.co/functions/v1/api
    variables:
      project:
        default: example
security:
  - bearerAuth: []
paths:
  /signup/mode:
    get:
      operationId: getSignupMode
      summary: Read a short-lived, server-attested account registration mode.
      security: []
      responses:
        "200":
          description: The current operator-controlled signup path.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupModeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /signup/preflight:
    post:
      operationId: preflightPublicSignup
      summary: Reserve public email signup capacity and issue an email-bound grant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSignupPreflightRequest"
      responses:
        "200":
          description: A short-lived grant that may be consumed by one email signup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSignupPreflightResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /pilot/preflight:
    post:
      operationId: preflightPilotSignup
      summary: Verify a one-use, email-bound closed-pilot invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotPreflightRequest"
      responses:
        "200":
          description: A short-lived grant that may be consumed by one signup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPreflightResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ApiError"
  /invites/preflight:
    post:
      operationId: preflightHouseholdInviteSignup
      summary: Exchange an active household invitation for an email-bound signup grant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInvitePreflightRequest"
      responses:
        "200":
          description: A short-lived zero-household-creation grant for one signup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPreflightResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /households:
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: >
            Durable household-creation receipt. Repeating the same operation
            returns the same household without creating a duplicate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [operationId, household]
                properties:
                  operationId:
                    type: string
                    format: uuid
                  household:
                    $ref: "#/components/schemas/Household"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /product-events:
    post:
      operationId: recordProductEvent
      summary: Acknowledge one privacy-safe, idempotent pilot product event.
      description: >
        Event properties must exactly match the reject-by-default
        @alyr/contracts analytics allow-list. Household and client-event UUIDs
        are routing/idempotency fields and are never copied into properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEventRequest"
      responses:
        "202":
          description: The event was inserted or replayed exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventAcknowledgement"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/complete:
    post:
      operationId: completeHouseholdOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingRequest"
      responses:
        "200":
          description: Household setup was recorded in provider-controlled account metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [householdId, onboarding]
                properties:
                  householdId:
                    type: string
                    format: uuid
                  onboarding:
                    type: string
                    const: complete
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sync/push:
    post:
      operationId: pushSyncOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Operations were applied, replayed idempotently, or returned as visible conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sync/pull:
    get:
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
            default: "0"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Ordered, authorized changes after the opaque cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /uploads/intents:
    post:
      operationId: createUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentRequest"
      responses:
        "201":
          description: A short-lived signed private upload target was prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            Household or Heldat cloud storage is at capacity. This response is
            action-required and is never eligible for automatic retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCapacityErrorEnvelope"
  /uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompletionRequest"
      responses:
        "200":
          description: Cloud presence, byte size, and SHA-256 checksum were confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /evidence/download:
    post:
      operationId: downloadEvidenceVersion
      summary: Download one authorized immutable EvidenceVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceDownloadRequest"
      responses:
        "200":
          description: >
            A short-lived provider-neutral GET target for the authorized
            immutable EvidenceVersion. The client must verify the returned
            bytes against the requested size and SHA-256 before persistence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDownloadIntentResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ApiError"
  /invites:
    post:
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreateRequest"
      responses:
        "201":
          description: One-time manual household invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreateResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /household-access:
    get:
      operationId: getHouseholdAccessSnapshot
      summary: Refresh the active household roster from the authoritative cloud.
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Active members and owner-visible pending invitations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [snapshot]
                properties:
                  snapshot:
                    $ref: "#/components/schemas/HouseholdAccessSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /household-storage:
    get:
      operationId: getHouseholdStorageUsage
      summary: Read authoritative retained cloud bytes for one active household.
      description: >
        Available to active owners, editors, and viewers. Missing households,
        deleted households, and absent or revoked memberships all return the
        same authorization response. The response excludes object identifiers,
        filenames, global usage, reservations, and internal plan controls.
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-confirmed retained bytes and household allowance.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdStorageUsageResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /household-access/member-role:
    post:
      operationId: changeHouseholdMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdMemberRoleChangeRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/member-revoke:
    post:
      operationId: revokeHouseholdMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdMemberRevokeRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/invite-cancel:
    post:
      operationId: cancelHouseholdInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInviteCancelRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/ownership-transfer:
    post:
      operationId: transferHouseholdOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdOwnershipTransferRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /invites/preview:
    post:
      operationId: previewInvite
      summary: Review the minimum household invitation details before joining.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptRequest"
      responses:
        "200":
          description: Privacy-scoped invitation review returned without changing membership.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [review]
                properties:
                  review:
                    $ref: "#/components/schemas/HouseholdInviteReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /invites/accept:
    post:
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptRequest"
      responses:
        "200":
          description: Membership activated.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /exports:
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreateRequest"
      responses:
        "201":
          description: Immutable export snapshot generated, stored, and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "200":
          description: Existing idempotent export snapshot returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The request conflicts with an acknowledged snapshot, an export
            allowance was reached, or cloud storage is at capacity. Storage
            capacity returns QUOTA_EXCEEDED with retryable set to false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/{exportId}:
    get:
      operationId: getExport
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/{exportId}/download:
    get:
      operationId: downloadExport
      summary: Download one authorized, server-verified continuity export.
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Export bytes. Content-Length and X-ALYR-Checksum-SHA256 match the
            immutable status descriptor and must be revalidated by the client.
          headers:
            Content-Disposition:
              description: Attachment filename matching the immutable status descriptor.
              schema:
                type: string
                pattern: '^attachment; filename="[A-Za-z0-9._-]{1,160}"$'
            Content-Length:
              description: Exact byte length matching the immutable status descriptor.
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 5242880
            X-ALYR-Checksum-SHA256:
              description: SHA-256 digest matching the immutable status descriptor.
              required: true
              schema:
                type: string
                pattern: "^[a-f0-9]{64}$"
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /account/deletion:
    post:
      operationId: deleteCurrentAccount
      summary: Re-authenticate and permanently remove the current account.
      description: >
        The password and confirmation email are verified server-side. A sole
        active member who owns a household also deletes that household and its
        private evidence. Editor/viewer memberships are removed while the
        household remains. If an owned household has another active member,
        deletion stops until ownership is transferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: Account, eligible sole-member households, and memberships removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionReceipt"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Household ownership must be transferred before deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Unauthorized:
      description: Sign-in required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: The caller lacks the required household capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: The record does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Conflict:
      description: The request conflicts with an acknowledged record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    TooManyRequests:
      description: A bounded household operation rate was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Gone:
      description: The requested export has expired and its retained bytes were removed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ServiceUnavailable:
      description: A retryable provider or storage boundary is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    HouseholdAccessMutation:
      description: The versioned owner action succeeded and the roster was refreshed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HouseholdAccessMutationResponse"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    PlaceDocumentCreatePayload:
      type: object
      additionalProperties: false
      required: [placeId, kind, relation, title]
      properties:
        placeId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [paper, artifact, media, record, note, link]
        relation:
          type: string
          enum:
            - ownership
            - identity
            - service
            - provenance
            - condition
            - insurance
            - valuation
            - legal
            - access
            - context
            - other
        title:
          type: string
          minLength: 1
          maxLength: 180
    PlaceDocumentVersionAddPayload:
      type: object
      additionalProperties: false
      required:
        - placeDocumentId
        - blobObjectId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
      properties:
        placeDocumentId:
          type: string
          format: uuid
        blobObjectId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    PilotPreflightRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, email, accessCode, launchMode]
      properties:
        apiVersion:
          type: integer
          const: 1
        email:
          type: string
          format: email
          maxLength: 254
        accessCode:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Z0-9]+$"
        launchMode:
          $ref: "#/components/schemas/SignupModeAttestation"
    PublicSignupPreflightRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, email, idempotencyKey, launchMode]
      properties:
        apiVersion:
          type: integer
          const: 1
        email:
          type: string
          format: email
          maxLength: 254
        idempotencyKey:
          type: string
          format: uuid
        launchMode:
          $ref: "#/components/schemas/SignupModeAttestation"
    SignupModeResponse:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - contract
        - signupMode
        - configVersion
        - issuedAt
        - expiresAt
        - signature
      properties:
        apiVersion:
          type: integer
          const: 1
        contract:
          type: string
          const: heldat-signup-mode-v1
        signupMode:
          type: string
          enum: [closed_pilot, public_email, public_email_google]
        configVersion:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
          pattern: "^[a-f0-9]{64}$"
    SignupModeAttestation:
      type: object
      additionalProperties: false
      required:
        - contract
        - signupMode
        - configVersion
        - issuedAt
        - expiresAt
        - signature
      properties:
        contract:
          type: string
          const: heldat-signup-mode-v1
        signupMode:
          type: string
          enum: [closed_pilot, public_email, public_email_google]
