openapi: 3.1.0
info:
  title: ALYR Pilot API
  version: 0.1.0
  description: >
    Provider-neutral authenticated API for the focused ALYR household,
    asset, evidence, and offline-sync pilot.
servers:
  - url: https://{project}.supabase.co/functions/v1/api
    variables:
      project:
        default: example
security:
  - bearerAuth: []
paths:
  /households:
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created with the caller as owner.
          content:
            application/json:
              schema:
                type: object
                required: [household]
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sync/push:
    post:
      operationId: pushSyncOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Operations were applied, replayed idempotently, or returned as visible conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sync/pull:
    get:
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
            default: "0"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Ordered, authorized changes after the opaque cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /uploads/intents:
    post:
      operationId: createUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentRequest"
      responses:
        "201":
          description: A short-lived signed private upload target was prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The household storage allowance was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompletionRequest"
      responses:
        "200":
          description: Cloud presence, byte size, and SHA-256 checksum were confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invites/accept:
    post:
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptRequest"
      responses:
        "200":
          description: Membership activated.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /exports:
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreateRequest"
      responses:
        "202":
          description: Immutable export snapshot queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /exports/{exportId}:
    get:
      operationId: getExport
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Unauthorized:
      description: Sign-in required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: The caller lacks the required household capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: The record does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Conflict:
      description: The request conflicts with an acknowledged record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    Household:
      type: object
      required: [id, name, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, household_id, user_id, role, status, version]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, editor, viewer]
        status:
          type: string
          enum: [active, revoked]
        version:
          type: integer
          minimum: 1
    DomainCommand:
      type: object
      additionalProperties: false
      required:
        - commandVersion
        - commandId
        - idempotencyKey
        - householdId
        - actorMemberId
        - deviceId
        - type
        - aggregateId
        - observedVersion
        - occurredAt
        - payload
      properties:
        commandVersion:
          type: integer
          const: 1
        commandId:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        householdId:
          type: string
          format: uuid
        actorMemberId:
          type: string
        deviceId:
          type: string
        type:
          type: string
          enum:
            - place.create
            - space.create
            - asset.create
            - asset.update
            - asset.move
            - asset.archive
            - evidence.create
            - evidence.version.add
            - evidence.review
        aggregateId:
          type:
            - string
            - "null"
        observedVersion:
          type:
            - integer
            - "null"
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonObject"
    SyncOperation:
      type: object
      additionalProperties: false
      required:
        - operationVersion
        - operationId
        - householdId
        - command
        - prerequisites
        - status
        - attemptCount
        - nextAttemptAt
        - lastErrorCode
        - createdAt
        - updatedAt
      properties:
        operationVersion:
          type: integer
          const: 1
        operationId:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        command:
          $ref: "#/components/schemas/DomainCommand"
        prerequisites:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, blobObjectId]
            properties:
              kind:
                type: string
                const: blob-stored
              blobObjectId:
                type: string
                format: uuid
        status:
          type: string
          enum:
            - on-device
            - queued
            - uploading
            - processing
            - synced
            - needs-attention
        attemptCount:
          type: integer
          minimum: 0
        nextAttemptAt:
          type:
            - string
            - "null"
          format: date-time
        lastErrorCode:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncCursor:
      type: object
      additionalProperties: false
      required: [cursorVersion, value, issuedAt]
      properties:
        cursorVersion:
          type: integer
          const: 1
        value:
          type:
            - string
            - "null"
        issuedAt:
          type:
            - string
            - "null"
          format: date-time
    SyncConflict:
      type: object
      additionalProperties: false
      required:
        - operationId
        - entityId
        - conflictKind
        - serverVersion
        - message
      properties:
        operationId:
          type: string
        entityId:
          type: string
        conflictKind:
          type: string
          enum: [location, ownership, permission, value, identifier, lifecycle]
        serverVersion:
          type: integer
          minimum: 0
        message:
          type: string
    SyncChange:
      type: object
      additionalProperties: false
      required:
        - sequence
        - entityType
        - entityId
        - householdId
        - version
        - tombstoned
        - body
        - changedAt
      properties:
        sequence:
          type: integer
          minimum: 1
        entityType:
          type: string
        entityId:
          type: string
        householdId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        tombstoned:
          type: boolean
        body:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
        changedAt:
          type: string
          format: date-time
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, operations]
      properties:
        apiVersion:
          type: integer
          const: 1
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOperation"
    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [acknowledgedOperationIds, conflicts, cursor]
      properties:
        acknowledgedOperationIds:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/SyncConflict"
        cursor:
          $ref: "#/components/schemas/SyncCursor"
    SyncPullResponse:
      type: object
      additionalProperties: false
      required: [changes, cursor]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        cursor:
          $ref: "#/components/schemas/SyncCursor"
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - householdId
        - evidenceId
        - evidenceVersionId
        - blobId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
        evidenceVersionId:
          type: string
          format: uuid
        blobId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadIntentResponse:
      type: object
      additionalProperties: false
      required: [uploadId, blobObjectId, expiresAt, uploadTarget]
      properties:
        uploadId:
          type: string
          format: uuid
        blobObjectId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        uploadTarget:
          $ref: "#/components/schemas/JsonObject"
    UploadCompletionRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, checksumSha256, byteSize]
      properties:
        apiVersion:
          type: integer
          const: 1
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
    UploadCompletionResponse:
      type: object
      required: [upload, note]
      properties:
        upload:
          type: object
          required: [id, objectKey, status]
          properties:
            id:
              type: string
              format: uuid
            objectKey:
              type: string
            status:
              type: string
              const: stored
        note:
          type: string
    InviteAcceptRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, oneTimeCode]
      properties:
        apiVersion:
          type: integer
          const: 1
        oneTimeCode:
          type: string
          minLength: 1
          maxLength: 128
    ExportCreateRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, householdId, format, assetIds, redacted]
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
        format:
          type: string
          enum: [pdf, json-manifest]
        assetIds:
          type: array
          maxItems: 500
          items:
            type: string
        redacted:
          type: boolean
    ExportStatusResponse:
      type: object
      additionalProperties: false
      required: [exportId, status, blobObjectId, expiresAt, error]
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, ready, failed, expired]
        blobObjectId:
          type:
            - string
            - "null"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    ApiError:
      type: object
      additionalProperties: false
      required: [errorVersion, code, message, retryable]
      properties:
        errorVersion:
          type: integer
          const: 1
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        retryable:
          type: boolean
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [errorVersion, code, message, retryable]
          properties:
            errorVersion:
              type: integer
              const: 1
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
            retryable:
              type: boolean
    ApiErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - CONFLICT_REQUIRES_REVIEW
        - IDEMPOTENCY_CONFLICT
        - INVALID_COMMAND
        - INVALID_CURSOR
        - INVALID_FILE
        - NOT_FOUND
        - OFFLINE
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - SESSION_EXPIRED
        - STORAGE_UNAVAILABLE
        - UNSUPPORTED_CONTRACT_VERSION
        - VALIDATION_FAILED
