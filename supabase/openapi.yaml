    ExportCreateRequest:
      type: object
      additionalProperties: false
      required:
        [apiVersion, householdId, format, assetIds, redacted, idempotencyKey]
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
        format:
          type: string
          enum: [pdf, json-manifest]
        assetIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
        redacted:
          type: boolean
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
    ExportStatusResponse:
      type: object
      additionalProperties: false
      required:
        - exportId
        - status
        - blobObjectId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
        - expiresAt
        - completedAt
        - error
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, ready, failed, expired]
        blobObjectId:
          type:
            - string
            - "null"
        fileName:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9._-]{1,160}$"
        mimeType:
          type:
            - string
            - "null"
          enum: [application/json, application/pdf, null]
        byteSize:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5242880
        checksumSha256:
          type:
            - string
            - "null"
          pattern: "^[a-f0-9]{64}$"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
