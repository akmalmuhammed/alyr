          uniqueItems: true
          items:
            type: string
            format: uuid
        departedHouseholdIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        deletedAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [errorVersion, code, message, retryable]
      properties:
        errorVersion:
          type: integer
          const: 1
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        retryable:
          type: boolean
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [errorVersion, code, message, retryable]
          properties:
            errorVersion:
              type: integer
              const: 1
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
            retryable:
              type: boolean
    ApiErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - CONFLICT_REQUIRES_REVIEW
        - IDEMPOTENCY_CONFLICT
        - INVALID_COMMAND
        - INVALID_CURSOR
        - INVALID_FILE
        - NOT_FOUND
        - OFFLINE
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - SESSION_EXPIRED
        - STORAGE_UNAVAILABLE
        - UNSUPPORTED_CONTRACT_VERSION
        - VALIDATION_FAILED
