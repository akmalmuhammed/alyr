        - accountId
        - role
        - membershipVersion
      properties:
        householdId:
          type: string
          format: uuid
        householdName:
          type: string
          minLength: 1
          maxLength: 120
        householdVersion:
          type: integer
          minimum: 1
        householdCreatedAt:
          type: string
          format: date-time
        membershipId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, editor, viewer]
        membershipVersion:
          type: integer
          minimum: 1
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - householdId
        - evidenceId
        - evidenceVersionId
        - blobId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
          description: >
            The asset Evidence ID, or the Place Document ID when this upload
            will be committed by place-document.version.add.
        evidenceVersionId:
          type: string
          format: uuid
          description: >
            The immutable Evidence Version ID, or Place Document Version ID,
            selected before upload.
        blobId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadIntentResponse:
      type: object
      additionalProperties: false
      required: [uploadId, blobObjectId, expiresAt, uploadTarget]
      properties:
        uploadId:
          type: string
          format: uuid
        blobObjectId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        uploadTarget:
          $ref: "#/components/schemas/JsonObject"
    UploadCompletionRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, checksumSha256, byteSize]
      properties:
        apiVersion:
          type: integer
          const: 1
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
    UploadCompletionResponse:
      type: object
      required: [upload, note]
      properties:
        upload:
          type: object
          required: [id, objectKey, status]
          properties:
            id:
              type: string
              format: uuid
            objectKey:
              type: string
            status:
              type: string
              const: stored
        note:
          type: string
    EvidenceDownloadRequest:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - householdId
        - evidenceId
        - evidenceVersionId
        - blobId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
          description: >
            The asset Evidence ID or Place Document ID that owns this immutable
            version.
        evidenceVersionId:
          type: string
          format: uuid
          description: >
            The immutable asset Evidence Version ID or Place Document Version
            ID whose bytes are requested.
        blobId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    InviteAcceptRequest:
