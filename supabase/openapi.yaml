openapi: 3.1.0
info:
  title: ALYR Pilot API
  version: 0.1.0
  description: >
    Provider-neutral authenticated API for the focused ALYR household,
    asset, evidence, and offline-sync pilot.
servers:
  - url: https://{project}.supabase.co/functions/v1/api
    variables:
      project:
        default: example
security:
  - bearerAuth: []
paths:
  /pilot/preflight:
    post:
      operationId: preflightPilotSignup
      summary: Verify a one-use, email-bound closed-pilot invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotPreflightRequest"
      responses:
        "200":
          description: A short-lived grant that may be consumed by one signup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPreflightResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ApiError"
  /invites/preflight:
    post:
      operationId: preflightHouseholdInviteSignup
      summary: Exchange an active household invitation for an email-bound signup grant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInvitePreflightRequest"
      responses:
        "200":
          description: A short-lived zero-household-creation grant for one signup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPreflightResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /households:
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created with the caller as owner.
          content:
            application/json:
              schema:
                type: object
                required: [household]
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /onboarding/complete:
    post:
      operationId: completeHouseholdOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingRequest"
      responses:
        "200":
          description: Household setup was recorded in provider-controlled account metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [householdId, onboarding]
                properties:
                  householdId:
                    type: string
                    format: uuid
                  onboarding:
                    type: string
                    const: complete
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sync/push:
    post:
      operationId: pushSyncOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Operations were applied, replayed idempotently, or returned as visible conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sync/pull:
    get:
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
            default: "0"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Ordered, authorized changes after the opaque cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /uploads/intents:
    post:
      operationId: createUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentRequest"
      responses:
        "201":
          description: A short-lived signed private upload target was prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The household storage allowance was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompletionRequest"
      responses:
        "200":
          description: Cloud presence, byte size, and SHA-256 checksum were confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /evidence/download:
    post:
      operationId: downloadEvidenceVersion
      summary: Download one authorized immutable EvidenceVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceDownloadRequest"
      responses:
        "200":
          description: >
            Authoritative evidence bytes. The client must verify byte size and
            SHA-256 against the requested immutable version before persistence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ApiError"
  /invites:
    post:
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreateRequest"
      responses:
        "201":
          description: One-time manual household invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreateResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /household-access:
    get:
      operationId: getHouseholdAccessSnapshot
      summary: Refresh the active household roster from the authoritative cloud.
      parameters:
        - in: query
          name: householdId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Active members and owner-visible pending invitations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [snapshot]
                properties:
                  snapshot:
                    $ref: "#/components/schemas/HouseholdAccessSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /household-access/member-role:
    post:
      operationId: changeHouseholdMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdMemberRoleChangeRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/member-revoke:
    post:
      operationId: revokeHouseholdMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdMemberRevokeRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/invite-cancel:
    post:
      operationId: cancelHouseholdInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInviteCancelRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /household-access/ownership-transfer:
    post:
      operationId: transferHouseholdOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdOwnershipTransferRequest"
      responses:
        "200":
          $ref: "#/components/responses/HouseholdAccessMutation"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /invites/accept:
    post:
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptRequest"
      responses:
        "200":
          description: Membership activated.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /exports:
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreateRequest"
      responses:
        "201":
          description: Immutable export snapshot generated, stored, and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "200":
          description: Existing idempotent export snapshot returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/{exportId}:
    get:
      operationId: getExport
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/{exportId}/download:
    get:
      operationId: downloadExport
      summary: Download one authorized, server-verified continuity export.
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Export bytes. Content-Length and X-ALYR-Checksum-SHA256 match the
            immutable status descriptor and must be revalidated by the client.
          headers:
            Content-Disposition:
              description: Attachment filename matching the immutable status descriptor.
              schema:
                type: string
                pattern: '^attachment; filename="[A-Za-z0-9._-]{1,160}"$'
            Content-Length:
              description: Exact byte length matching the immutable status descriptor.
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 5242880
            X-ALYR-Checksum-SHA256:
              description: SHA-256 digest matching the immutable status descriptor.
              required: true
              schema:
                type: string
                pattern: "^[a-f0-9]{64}$"
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /account/deletion:
    post:
      operationId: deleteCurrentAccount
      summary: Re-authenticate and permanently remove the current account.
      description: >
        The password and confirmation email are verified server-side. A sole
        active member who owns a household also deletes that household and its
        private evidence. Editor/viewer memberships are removed while the
        household remains. If an owned household has another active member,
        deletion stops until ownership is transferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: Account, eligible sole-member households, and memberships removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionReceipt"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Household ownership must be transferred before deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Unauthorized:
      description: Sign-in required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: The caller lacks the required household capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: The record does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Conflict:
      description: The request conflicts with an acknowledged record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    TooManyRequests:
      description: The household export creation rate was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Gone:
      description: The requested export has expired and its retained bytes were removed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ServiceUnavailable:
      description: A retryable provider or storage boundary is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    HouseholdAccessMutation:
      description: The versioned owner action succeeded and the roster was refreshed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HouseholdAccessMutationResponse"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    PlaceDocumentCreatePayload:
      type: object
      additionalProperties: false
      required: [placeId, kind, relation, title]
      properties:
        placeId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [paper, artifact, media, record, note, link]
        relation:
          type: string
          enum:
            - ownership
            - identity
            - service
            - provenance
            - condition
            - insurance
            - valuation
            - legal
            - access
            - context
            - other
        title:
          type: string
          minLength: 1
          maxLength: 180
    PlaceDocumentVersionAddPayload:
      type: object
      additionalProperties: false
      required:
        - placeDocumentId
        - blobObjectId
        - fileName
        - mimeType
        - byteSize
        - checksumSha256
      properties:
        placeDocumentId:
          type: string
          format: uuid
        blobObjectId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    PilotPreflightRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, email, accessCode]
      properties:
        apiVersion:
          type: integer
          const: 1
        email:
          type: string
          format: email
          maxLength: 254
        accessCode:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Z0-9]+$"
    PilotPreflightResponse:
      type: object
      additionalProperties: false
      required: [apiVersion, enrollmentGrant, expiresAt]
      properties:
        apiVersion:
          type: integer
          const: 1
        enrollmentGrant:
          type: string
          pattern: "^[a-f0-9]{64}$"
        expiresAt:
          type: string
          format: date-time
    HouseholdInvitePreflightRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, email, oneTimeCode]
      properties:
        apiVersion:
          type: integer
          const: 1
        email:
          type: string
          format: email
          maxLength: 254
        oneTimeCode:
          type: string
          minLength: 1
          maxLength: 128
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, householdId]
      properties:
        apiVersion:
          type: integer
          const: 1
        householdId:
          type: string
          format: uuid
    Household:
      type: object
      required: [id, name, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, household_id, user_id, role, status, version]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, editor, viewer]
        status:
          type: string
          enum: [active, revoked]
        version:
          type: integer
          minimum: 1
    DomainCommand:
      type: object
      additionalProperties: false
      required:
        - commandVersion
        - commandId
        - idempotencyKey
        - householdId
        - actorMemberId
        - deviceId
        - type
        - aggregateId
        - observedVersion
        - occurredAt
        - payload
      properties:
        commandVersion:
          type: integer
          const: 1
        commandId:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        householdId:
          type: string
          format: uuid
        actorMemberId:
          type: string
        deviceId:
          type: string
        type:
          type: string
          enum:
            - place.create
            - place.update
            - space.create
            - space.update
            - asset.create
            - asset.update
            - asset.move
            - asset.archive
            - asset.restore
            - evidence.create
            - evidence.version.add
            - evidence.review
            - place-document.create
            - place-document.version.add
            - value.create
            - value.update
            - value.delete
        aggregateId:
          type:
            - string
            - "null"
        observedVersion:
          type:
            - integer
            - "null"
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonObject"
    SyncOperation:
      type: object
      additionalProperties: false
      required:
        - operationVersion
        - operationId
        - householdId
        - command
        - prerequisites
        - status
        - attemptCount
        - nextAttemptAt
        - lastErrorCode
        - createdAt
        - updatedAt
      properties:
        operationVersion:
          type: integer
          const: 1
        operationId:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        command:
          $ref: "#/components/schemas/DomainCommand"
        prerequisites:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, blobObjectId]
            properties:
              kind:
                type: string
                const: blob-stored
              blobObjectId:
                type: string
                format: uuid
        status:
          type: string
          enum:
            - on-device
            - queued
            - uploading
            - processing
            - synced
            - needs-attention
        attemptCount:
          type: integer
          minimum: 0
        nextAttemptAt:
          type:
            - string
            - "null"
          format: date-time
        lastErrorCode:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncCursor:
      type: object
      additionalProperties: false
      required: [cursorVersion, value, issuedAt]
      properties:
        cursorVersion:
          type: integer
          const: 1
        value:
          type:
            - string
            - "null"
        issuedAt:
          type:
            - string
            - "null"
          format: date-time
    SyncConflict:
      type: object
      additionalProperties: false
      required:
        - operationId
        - entityId
        - conflictKind
        - serverVersion
        - message
      properties:
        operationId:
          type: string
        entityId:
          type: string
        conflictKind:
          type: string
          enum: [location, ownership, permission, value, identifier, lifecycle]
        serverVersion:
          type: integer
          minimum: 0
        message:
          type: string
    SyncChange:
      type: object
      additionalProperties: false
      required:
        - sequence
        - entityType
        - entityId
        - householdId
        - version
        - tombstoned
        - body
        - changedAt
      properties:
        sequence:
          type: integer
          minimum: 1
        entityType:
          type: string
        entityId:
          type: string
        householdId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        tombstoned:
          type: boolean
        body:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
        changedAt:
          type: string
          format: date-time
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [apiVersion, operations]
      properties:
        apiVersion:
          type: integer
          const: 1
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOperation"
    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [acknowledgedOperationIds, conflicts, cursor]
      properties:
        acknowledgedOperationIds:
          type: array
          items:
            type: string
