          format: uuid
        role:
          type: string
          enum: [editor, viewer]
        status:
          type: string
          const: pending
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    HouseholdAccessSnapshot:
