project_id = "alyr-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://heldat.app"
additional_redirect_urls = [
  "heldat://callback",
  "heldat://reset-password",
  "https://heldat.app/callback",
  "https://heldat.app/auth/callback",
  "https://heldat.app/join",
  "https://heldat.app/join/*",
  "https://heldat.app/reset-password",
  "https://heldat.app/reset-password/*",
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/reset-password",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/heldat_before_user_created"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.vector]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.api]
# `/pilot/preflight` must run before an account exists. Every other route still
# verifies its bearer with `auth.getUser()` inside the function.
verify_jwt = false
